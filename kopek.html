    :root { --green: #849445; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--green); }
    body {
      overflow: hidden;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: var(--green);
    }
    .hint, .hud, .load {
      position: fixed;
      z-index: 2;
      pointer-events: none;
      color: #fff;
    }
    .hint {
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      transition: opacity 0.4s ease;
    }
    .hint span {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .hint.is-gone { opacity: 0; }
    .hud {
      left: 16px;
      bottom: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .hud strong { font-size: 1.05rem; }
    .load {
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      background: var(--green);
      font-weight: 600;
      transition: opacity 0.35s ease;
    }
    .load.is-gone { opacity: 0; pointer-events: none; }
  </style>
</head>

  <script>
    (function () {
      const BASE = new URL("kopek-canvas/", location.href).href;
      const HEAD_NX = 0.62;
      const HEAD_NY = 0.45;
      const FOLLOW = 11;
      const SETTLE = 4;

      const canvas = document.getElementById("view");
      const ctx = canvas.getContext("2d", { alpha: false });
      const hint = document.getElementById("hint");
      const load = document.getElementById("load");
      const hudTime = document.getElementById("hudTime");
      const hudMeta = document.getElementById("hudMeta");

      let keys = [];
      let ring = [];
      let centerBmp = null;
      let ready = false;
      let targetU = 0;
      let softU = 0;
      let targetDist = 0;
      let dist = 0;
      let lastTs = 0;
      let lastMove = 0;
      let shown = -2;
      let box = null;
      let lastHud = "";
      let hintHidden = false;
      let pointerX = 0;
      let pointerY = 0;
      let hasPointer = false;

      function clamp(v, a, b) {
        return v < a ? a : v > b ? b : v;
      }

      function wrap01(v) {
        v %= 1;
        return v < 0 ? v + 1 : v;
      }

      function lerpU(a, b, k) {
        let d = b - a;
        if (d > 0.5) d -= 1;
        if (d < -0.5) d += 1;
        return wrap01(a + d * k);
      }

      function angleToU(dx, dy) {
        let a = Math.atan2(dy, dx) - Math.PI / 2;
        if (a < 0) a += Math.PI * 2;
        return a / (Math.PI * 2);
      }

      function headOnScreen() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        if (!box) {
          return {
            x: innerWidth * 0.5,
            y: innerHeight * 0.5,
            reach: Math.min(innerWidth, innerHeight) * 0.42
          };
        }
        return {
          x: (box.dx + HEAD_NX * box.dw) / dpr,
          y: (box.dy + HEAD_NY * box.dh) / dpr,
          reach: Math.min(innerWidth, innerHeight) * 0.42
        };
      }

      function indexFromU(u) {
        const n = keys.length;
        const x = wrap01(u) * n;
        const i = Math.min(n - 1, Math.floor(x));
        const p = x - i;
        const start = ring.starts[i];
        const count = ring.counts[i];
        if (count <= 1) return start;
        return start + p * (count - 1);
      }

      function layout() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        const sample = centerBmp || (ring[0] && ring[0].bmp);
        if (!sample) return;
        const s = Math.max(w / sample.width, h / sample.height);
        const dw = sample.width * s;
        const dh = sample.height * s;
        box = { w: w, h: h, dx: (w - dw) / 2, dy: (h - dh) / 2, dw: dw, dh: dh };
      }

      function draw(bmp, clear) {
        if (!box || !bmp) return;
        if (clear !== false) {
          ctx.globalAlpha = 1;
          ctx.fillStyle = "#849445";
          ctx.fillRect(0, 0, box.w, box.h);
        }
        ctx.drawImage(bmp, box.dx, box.dy, box.dw, box.dh);
      }

      function setHud(t, name) {
        const text = Number(t).toFixed(2) + " sn";
        if (text === lastHud) return;
        lastHud = text;
        hudTime.textContent = text;
        hudMeta.textContent = "yön: " + name;
      }

      function paint() {
        if (!ready || !box) return;

        if (dist < 0.16) {
          if (shown !== -1) {
            shown = -1;
            draw(centerBmp, true);
            setHud(0.06, "orta");
          }
          return;
        }

        const len = ring.length;
        let i = Math.round(indexFromU(softU));
        i = ((i % len) + len) % len;
        const frame = ring[i];
        if (shown !== i) {
          shown = i;
          draw(frame.bmp, true);
          setHud(frame.t, frame.name);
        }
      }

      function onMove(e) {
        pointerX = e.clientX;
        pointerY = e.clientY;
        hasPointer = true;
        lastMove = performance.now();
        if (!hintHidden) {
          hintHidden = true;
          hint.classList.add("is-gone");
        }
      }

      function tick(ts) {
        if (!ready) {
          requestAnimationFrame(tick);
          return;
        }
        const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
        lastTs = ts;

        if (!hasPointer) {
          targetDist = 0;
        } else {
          const head = headOnScreen();
          const dx = pointerX - head.x;
          const dy = pointerY - head.y;
          targetDist = Math.hypot(dx, dy) / head.reach;
          targetU = angleToU(dx, dy);
        }

        const moving = hasPointer && ts - lastMove < 160;
        const k = 1 - Math.exp(-(moving ? FOLLOW : SETTLE) * dt);
        dist += (targetDist - dist) * k;
        softU = lerpU(softU, targetU, k);
        paint();
        requestAnimationFrame(tick);
      }

      function loadImage(src) {
        return new Promise(function (resolve, reject) {
          const img = new Image();
          img.onload = function () { resolve(img); };
          img.onerror = function () { reject(new Error("img:" + src)); };
          img.src = src;
        });
      }

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          const s = document.createElement("script");
          s.src = src;
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error("script:" + src)); };
          document.head.appendChild(s);
        });
      }

      async function boot() {
        // file:// üzerinde fetch engelli; manifest.js script ile yüklenir
        if (!window.KOPEK_MANIFEST) {
          await loadScript(BASE + "manifest.js");
        }
        const manifest = window.KOPEK_MANIFEST;
        if (!manifest || !manifest.ring || !manifest.ring.length) {
          throw new Error("manifest boş");
        }

        keys = manifest.keys;
        const files = {};
        files[manifest.center.file] = true;
        for (let i = 0; i < manifest.ring.length; i++) {
          files[manifest.ring[i].file] = true;
        }
        const list = Object.keys(files);
        const images = {};
        let done = 0;
        const CONCURRENCY = 12;

        async function loadOne(file) {
          images[file] = await loadImage(BASE + file);
          done += 1;
          load.firstChild.textContent =
            "Köpek hazırlanıyor… " + Math.round((done / list.length) * 100) + "%";
        }

        for (let i = 0; i < list.length; i += CONCURRENCY) {
          await Promise.all(list.slice(i, i + CONCURRENCY).map(loadOne));
        }

        ring = manifest.ring.map(function (item) {
          return {
            bmp: images[item.file],
            t: item.t,
            name: item.name
          };
        });
        ring.starts = manifest.starts;
        ring.counts = manifest.counts;
        centerBmp = images[manifest.center.file];

        layout();
        ready = true;
        softU = 0;
        load.classList.add("is-gone");
        paint();
        requestAnimationFrame(tick);
      }

      let resizeT = 0;
      addEventListener("resize", function () {
        clearTimeout(resizeT);
        resizeT = setTimeout(function () {
          layout();
          shown = -2;
          if (ready) paint();
        }, 100);
      });
      addEventListener("pointermove", onMove, { passive: true });
      addEventListener("pointerleave", function () {
        hasPointer = false;
        targetDist = 0;
      });

      boot().catch(function (err) {
        console.error(err);
        load.firstChild.textContent =
          "kopek-canvas yüklenemedi (" + (err && err.message ? err.message : "hata") + ")";
      });
    })();
  </script>
</body>
</html>
